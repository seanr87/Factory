# Verifies that gate detection paths still exist in the upstream Strategus template.
#
# Studies are scaffolded from upstream `main` at provision time, so upstream can
# restructure without warning. It has done so twice in nine months: v2.0.0 on
# 2026-05-21 reorganised the whole template, and December 2025 moved cohorts out
# of inst/sampleStudy/. Either change would have silently broken Gate 3 and Gate 4
# for every study provisioned afterwards.
#
# Detection is a contract with upstream's file layout. This job is what makes a
# break in that contract announce itself instead of going quiet — the same
# principle the rest of the system runs on.
#
# The issue it opens is not just an alarm: it works out where each file most
# likely moved to, and names the template to edit, the front-matter key to change,
# the value to change it to, and the commands to run afterwards. See
# .github/scripts/path_contract.py.

name: Path Contract Check

on:
  schedule:
    # Daily at 07:00 UTC, ahead of the working day in US and EU timezones.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the report without opening or closing an issue'
        required: false
        type: boolean
        default: false
      simulate_move:
        description: 'Rehearse a restructure, e.g. "scriptsForStudyDesigner/=scripts/designer/"'
        required: false
        type: string
      simulate_missing:
        description: 'Rehearse a deletion: comma-separated upstream paths to treat as gone'
        required: false
        type: string
  push:
    paths:
      - '.github/issue-templates/**'
      - '.github/data/gates.json'
      - '.github/scripts/**'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the templates and the generated config agree
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/gatelib.py
          python3 .github/scripts/build_gates.py --check

      - name: Check detection paths against upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ARGS=(--factory-repo "${{ github.repository }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ -n "${{ inputs.simulate_move }}" ]]; then
            ARGS+=(--simulate-move "${{ inputs.simulate_move }}")
          fi
          if [[ -n "${{ inputs.simulate_missing }}" ]]; then
            ARGS+=(--simulate-missing "${{ inputs.simulate_missing }}")
          fi

          python3 .github/scripts/path_contract.py "${ARGS[@]}"

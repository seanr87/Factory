# Finds studies and partners that have gone quiet.
#
# A stalled study never announces itself, it just goes quiet. Nothing arrives to
# tell you one is stuck, so this goes looking on a schedule and says so out loud.
#
# Replaces activity-check.yml, which measured repository `pushed_at` — a README
# typo counted as progress there. The clock here is time-in-gate, which cannot be
# reset by activity that is not progress.

name: Stall Check

on:
  schedule:
    # 07:30 UTC daily, just after Path Contract Check.
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      threshold_days:
        description: 'Override the stall threshold for this run'
        required: false
        type: string
      dry_run:
        description: 'Print the dashboard without writing anything'
        required: false
        type: boolean
        default: false

permissions:
  # write: Gate 6 advances are committed to the state files
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_ADMIN_TOKEN }}

      # Gate 6 is the one gate no push can evidence — execution happens on
      # machines Factory never sees. Its only trace is the partner issue labels,
      # so it is derived here, before the stall sweep reads the same state.
      - name: Derive Gate 6 from partner status
        id: gate6
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python3 .github/scripts/derive_partner_gates.py --dry-run
          else
            python3 .github/scripts/derive_partner_gates.py
          fi

      - name: Commit Gate 6 advances
        if: steps.gate6.outputs.changed == 'true'
        env:
          STUDIES: ${{ steps.gate6.outputs.changed_studies }}
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name "OHDSI Study Factory"
          git add .github/data/state

          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Advance to gate 6 from partner status: ${STUDIES}"

          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin "${{ github.ref_name }}" \
               && git push --quiet origin "HEAD:${{ github.ref_name }}"; then
              echo "✅ Committed (attempt $attempt)"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not commit Gate 6 advances after 3 attempts"
          exit 1

      - name: Check for stalls
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          ARGS=(--factory-repo "${{ github.repository }}")
          if [[ -n "${{ inputs.threshold_days }}" ]]; then
            ARGS+=(--threshold "${{ inputs.threshold_days }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          python3 .github/scripts/stall_check.py "${ARGS[@]}"
